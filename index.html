<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Gerador de SKU</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Gerador de SKU</h1>

    <!-- PRODUTO -->
    <label>Produto</label>
    <input
      type="text"
      id="produto"
      placeholder="Ex: Blusa Canelada"
    />

    <!-- AÇÃO VARIAÇÃO -->
    <button
      type="button"
      class="add-variacao"
      onclick="adicionarVariacao()"
    >
      + adicionar variação
    </button>

    <!-- VARIAÇÕES (OPCIONAL) -->
    <div id="variacoes"></div>

    <!-- GERAR -->
    <button
      type="button"
      class="gerar"
      onclick="gerarSKUs()"
    >
      Gerar SKU
    </button>

    <!-- STATUS -->
    <p id="status"></p>

    <!-- RESULTADO -->
    <div id="resultado"></div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
