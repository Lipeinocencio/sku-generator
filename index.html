<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Gerador de SKU</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Gerador de SKU</h1>

    <input
      type="text"
      id="produto"
      placeholder="Ex: Blusa Canelada"
    />

    <button type="button" onclick="adicionarVariacao()">
      + adicionar variação
    </button>

    <div id="variacoes"></div>

    <button type="button" onclick="gerarSKUs()">
      Gerar SKU
    </button>

    <p id="status"></p>
    <div id="resultado"></div>
  </div>

  <!-- TESTE DE JS -->
  <script>
    console.log("JS INLINE FUNCIONANDO");
  </script>

  <!-- SCRIPT PRINCIPAL -->
  <script src="./script.js"></script>
</body>
</html>
