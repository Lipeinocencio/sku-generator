<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de SKU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-container" id="telaLogin">
    <div class="login-icon">🔐</div>
    <h1 class="login-title">Gerador de SKU</h1>
    <p class="login-subtitle">Faça login para acessar o sistema</p>
    <input type="text" id="loginUser" class="login-input" placeholder="Usuário" />
    <input type="password" id="loginPass" class="login-input" placeholder="Senha" />
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" id="btnLogin">Entrar</button>
  </div>

  <div class="container hidden" id="telaApp">
    <div class="app-header">
      <h1>📦 Gerador de SKU</h1>
      <div class="user-info">
        <span id="welcomeUser"></span>
        <button class="btn-logout" id="btnLogout">Sair</button>
      </div>
    </div>

    <div id="listaProdutos"></div>
    <small class="add" id="btnAddProduto">+ adicionar produto</small>

    <button id="btnGerar">Gerar SKUs</button>
    <button class="btn-secondary" id="btnLimpar" style="margin-top:8px">Limpar campos</button>

    <div id="status"></div>
    <div id="resultado"></div>

    <h2 class="toggle-header" id="toggleSalvos">📋 SKUs Salvos <span class="counter" id="skuCounter">(0)</span> <span class="toggle-icon" id="toggleIcon">▶</span></h2>

    <div id="secaoSalvos" style="display:none;">
      <div class="search-bar">
        <input type="text" id="buscaSku" class="campo" placeholder="Buscar SKU..." />
        <button class="btn-secondary" id="btnBuscar">🔍</button>
      </div>
      <div class="sku-list" id="skuList"></div>
      <div class="btn-group">
        <button class="btn-success" id="btnExportar">📥 Exportar CSV</button>
        <button class="btn-danger" id="btnLimparTudo">🗑 Limpar Tudo</button>
      </div>
    </div>
  </div>

  <script src="dados_iniciais.js"></script>
  <script src="script.js"></script>
</body>
</html>
