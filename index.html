<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de SKU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Gerador de SKU</h1>

  <label>Produto base</label>
  <input id="produto" placeholder="Ex: Blusa Celina">

  <label>Variações</label>

  <div id="variacoes">
    <input placeholder="Ex: Verde">
  </div>

  <button onclick="adicionarVariacao()">+ Adicionar variação</button>
  <button onclick="gerarSKUs()">Gerar SKUs</button>

  <div id="resultado"></div>
  <p id="status"></p>
</div>

<script src="script.js?v=2"></script>
</body>
</html>
