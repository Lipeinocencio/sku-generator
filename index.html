<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de SKU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Gerador de SKU</h1>

    <input id="produto" type="text" placeholder="Ex: Blusa Canelada" />

    <div id="variacoes"></div>

    <small class="add" id="btnVariacao">+ adicionar variação</small>

    <button id="btnGerar">Gerar SKU</button>

    <div id="status"></div>
    <div id="resultado"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
